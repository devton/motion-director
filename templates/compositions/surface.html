<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Surfaces — one product object per ask, as a card deck</title>
  </head>
  <body>
    <template>
      <style>
        /* A data-driven starting point: one card per LAYOUT.SURFACES entry. Replace or extend a card with the
           product's real object (a scannable code, a schedule grid, a split diagram) when the story needs it. */
        #sf-root {
          position: absolute;
          inset: 0;
          font-family: var(--font-ui);
          color: var(--ink);
        }
        .sf-card {
          position: absolute;
          left: 968px;
          top: 300px;
          width: 720px;
          height: 712px;
          border-radius: 24px;
          background: var(--panel);
          box-shadow: 0 30px 80px rgba(15, 30, 70, 0.16), 0 0 0 1px rgba(15, 30, 70, 0.06);
          overflow: hidden;
        }
        .sf-head {
          position: absolute;
          left: 36px;
          top: 30px;
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 28px;
          font-weight: 700;
          white-space: nowrap;
        }
        .sf-ico {
          width: 48px;
          height: 48px;
          border-radius: 12px;
          background: var(--accent-soft);
          color: var(--accent-ink);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sf-ico svg {
          width: 28px;
          height: 28px;
        }
        .sf-st {
          position: absolute;
          right: 36px;
          top: 34px;
          height: 40px;
          padding: 0 16px;
          border-radius: 20px;
          font-size: 20px;
          font-weight: 700;
          line-height: 40px;
          white-space: nowrap;
        }
        .sf-st0 {
          background: var(--warn-soft);
          color: var(--warn-ink);
        }
        .sf-st1 {
          background: var(--accent);
          color: var(--on-accent);
        }
        .sf-big {
          position: absolute;
          left: 36px;
          top: 104px;
          font-size: 64px;
          font-weight: 800;
          letter-spacing: -0.04em;
          line-height: 72px;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        .sf-sub {
          position: absolute;
          left: 36px;
          top: 186px;
          font-size: 24px;
          font-weight: 500;
          color: var(--muted);
          white-space: nowrap;
        }
        .sf-rows {
          position: absolute;
          left: 36px;
          top: 250px;
          width: 648px;
        }
        .sf-row {
          position: relative;
          height: 66px;
          display: flex;
          align-items: center;
          gap: 16px;
          border-bottom: 1px solid var(--line);
          font-size: 24px;
          white-space: nowrap;
        }
        .sf-row b {
          font-weight: 500;
          color: var(--muted);
        }
        .sf-row span {
          margin-left: auto;
          font-weight: 700;
          font-variant-numeric: tabular-nums;
        }
        .sf-ok {
          flex: none;
          width: 28px;
          height: 28px;
          border-radius: 50%;
          background: var(--accent);
          color: var(--on-accent);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sf-ok svg {
          width: 16px;
          height: 16px;
          stroke-width: 3.4;
        }
        .sf-foot {
          position: absolute;
          left: 36px;
          top: 620px;
          width: 648px;
          height: 60px;
          border-radius: 12px;
          background: var(--primary);
          color: var(--on-primary);
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 20px;
          font-family: var(--font-mono);
          font-size: 20px;
          font-weight: 600;
          white-space: nowrap;
        }
        .sf-foot i {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--accent);
        }
      </style>

      <div id="sf-root" data-composition-id="surface" data-width="1920" data-height="1080"></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const L = LAYOUT;
          const T = L.T;
          const T0 = T.win.surface[0];
          const DUR = T.win.surface[1] - T0;
          const at = (r) => r - T0;
          const root = document.getElementById("sf-root");

          L.SURFACES.forEach((S, k) => {
            const A = T.ASK[k];
            if (!A) return;
            const card = document.createElement("div");
            card.className = "sf-card";
            card.innerHTML =
              `<div class="sf-head"><span class="sf-ico">${UI.ICON[S.icon] || UI.ICON.bolt}</span>${S.title}</div>` +
              `<div class="sf-st sf-st0">${S.status[0]}</div><div class="sf-st sf-st1">${S.status[1]}</div>` +
              `<div class="sf-big">${UI.money(0)}</div><div class="sf-sub">${S.sub}</div>` +
              `<div class="sf-rows">${S.rows.map(([a, b]) => `<div class="sf-row"><b>${a}</b><span>${b}</span><i class="sf-ok">${UI.ICON.check}</i></div>`).join("")}</div>` +
              `<div class="sf-foot"><i></i>${S.footer}</div>`;
            root.appendChild(card);
            UI.layered(card);
            const q = (s) => card.querySelector(s);
            const qa = (s) => Array.from(card.querySelectorAll(s));

            // deck in: from the right and slightly large; the previous card leaves to the left (below)
            gsap.set(card, { autoAlpha: 0 });
            tl.set(card, { autoAlpha: 1 }, at(A.build - 0.05));
            tl.fromTo(card, { x: 150, scale: 1.04 }, { x: 0, scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, at(A.build - 0.05));
            const parts = [q(".sf-head"), q(".sf-st0"), q(".sf-big"), q(".sf-sub")];
            gsap.set(parts, { opacity: 0, y: 18 });
            tl.to(parts, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.07 }, at(A.build + 0.1));
            UI.counter(tl, q(".sf-big"), { from: 0, to: S.big, t0: A.build + 0.3, d: 0.6, fmt: (v) => UI.money(v), offset: T0 });
            qa(".sf-row").forEach((row, i) => {
              gsap.set(row, { opacity: 0, x: 40 });
              tl.to(row, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at(A.build + 0.3 + i * 0.08));
            });
            // the state flips: rows check in turn, the status pill swaps (never two pills visible at once)
            const done = A.build + S.done;
            qa(".sf-ok").forEach((ok, i) => {
              gsap.set(ok, { scale: 0 });
              tl.to(ok, { scale: 1, duration: 0.25, ease: "back.out(3)" }, at(done + i * 0.12));
            });
            gsap.set(q(".sf-st1"), { autoAlpha: 0 });
            tl.set(q(".sf-st0"), { autoAlpha: 0 }, at(done));
            tl.fromTo(q(".sf-st1"), { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, at(done));
            tl.fromTo(card, { scale: 1 }, { scale: 1.03, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at(done));
            gsap.set(q(".sf-foot"), { opacity: 0, y: 30 });
            tl.to(q(".sf-foot"), { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, at(done + 0.12));
            // deck out when the next surface arrives (or the finale)
            const next = T.ASK[k + 1] && L.SURFACES[k + 1] ? T.ASK[k + 1].build - 0.1 : T.outro;
            tl.to(card, { autoAlpha: 0, x: -170, scale: 0.9, filter: "blur(6px)", duration: 0.32, ease: "power2.in" }, at(next));
          });

          tl.to({}, { duration: 0.01 }, DUR - 0.01);
          window.__timelines["surface"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
