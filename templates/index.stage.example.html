<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Flow showcase</title>
    <!-- Vendored GSAP + plugins (setup.sh copies them), so the render never touches the network. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/CustomEase.min.js"></script>
    <script src="assets/vendor/MotionPathPlugin.min.js"></script>
    <script src="assets/vendor/DrawSVGPlugin.min.js"></script>
    <script>
      gsap.registerPlugin(CustomEase, MotionPathPlugin, DrawSVGPlugin);
    </script>
    <!-- Load order: per-frame helpers, the spine (layout-stage.js installed as layout.js), the UI kit, the camera,
         the board geometry (wires). -->
    <script src="assets/lib/hw.js"></script>
    <script src="assets/lib/layout.js"></script>
    <script src="assets/lib/ui.js"></script>
    <script src="assets/lib/camera.js"></script>
    <script src="assets/lib/board.js"></script>
    <style>
      /* Theme tokens: set them from DESIGN.md (the subject's brand). Every template reads only these. */
      :root {
        --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
        --hero-bg: #0b1733;
        --hero-bg-2: #16306a;
        --hero-ink: #ffffff;
        --hero-muted: #a9bbdb;
        --hero-light: rgba(64, 214, 190, 0.55);
        --work-bg: #f4f6fa;
        --grid: rgba(0, 0, 0, 0); /* the workspace stays plain: the board draws its own world-space grid */
        --panel: #ffffff;
        --ink: #16306a;
        --muted: #545d6e;
        --line: #e5e7eb;
        --soft: #f1f4f9;
        --primary: #16306a;
        --on-primary: #ffffff;
        --accent: #2fd49b;
        --on-accent: #16306a;
        --accent-ink: #0b7a57;
        --accent-soft: #e3f9f1;
        --warn-soft: #fff4e0;
        --warn-ink: #8a5200;
        --char-bg: #3b2fd1;
        /* the 3D stage */
        --board-grid: rgba(22, 48, 106, 0.16);
        --wire: #b9c2d3;
        --ghost: #8c98ae;
        --run: #3867f0;
        --ok: #12a150;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--hero-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--hero-bg);
        font-family: var(--font-ui);
      }
      #root div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- Slots: data-start / data-duration MUST equal LAYOUT.T.win (DOM order = z order). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="el-bg" class="clip" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="25.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="el-stage" class="clip" data-composition-id="stage" data-composition-src="compositions/stage-3d.html" data-start="2.4" data-duration="16.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-stage-hud" class="clip" data-composition-id="stage-hud" data-composition-src="compositions/stage-hud.html" data-start="2.4" data-duration="16.8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-title" class="clip" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="3.4" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="el-finale" class="clip" data-composition-id="finale" data-composition-src="compositions/finale.html" data-start="18.2" data-duration="7.3" data-track-index="4" data-width="1920" data-height="1080"></div>
      <!-- Audio: the score (scripts/build-score.sh) and a few SFX on physical moments (volumes 0.1-0.3). -->
      <audio id="a-score" src="assets/audio/score.wav" data-start="0" data-duration="25.5" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
